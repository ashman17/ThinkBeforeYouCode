[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tbyc-dataset"
version = "0.1.0"
description = "Dataset curation pipeline for the Think Before You Code benchmark"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
	"python-dotenv>=1.0.1",
	"outlines[ollama]>=1.2.2",
	"ollama>=0.4.0",
	"pydantic>=2.7.0",
]

[project.scripts]
tbyc-dataset = "tbyc_dataset.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
