[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tbyc-dataset"
version = "0.1.0"
description = "Dataset curation pipeline for the Think Before You Code benchmark"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
	"python-dotenv>=1.0.1",
	"outlines[ollama]>=1.2.2",
	"ollama>=0.4.0",
	"openai>=1.30.0",
	"pydantic>=2.7.0",
]

[project.optional-dependencies]
eval = [
	"numpy>=1.24.0",
	"rank-bm25>=0.2.1",
	"faiss-cpu>=1.7.4",
	"transformers>=4.30.0",
	"torch>=2.0.0",
]
viz = [
	"numpy>=1.24.0",
	"matplotlib>=3.7.0",
]

[project.scripts]
tbyc-dataset = "tbyc_dataset.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
